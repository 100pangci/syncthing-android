name: Update Syncthing submodule

on:
  schedule:
    # Run every Wednesday at 19:00 UTC
    - cron: '0 19 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-syncthing-submodule:
    name: Update Syncthing submodule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Get current submodule commit
        id: current
        run: |
          CURRENT_COMMIT=$(git ls-tree HEAD syncthing/src/github.com/syncthing/syncthing | awk '{print $3}')
          echo "commit=${CURRENT_COMMIT}" >> $GITHUB_OUTPUT
          echo "Current commit: ${CURRENT_COMMIT}"

      # Stable releases only: the /releases/latest endpoint ignores drafts AND
      # prereleases, so RC / preview cores are never picked up automatically.
      - name: Get latest syncthing stable release commit
        id: latest
        run: |
          LATEST_TAG=$(curl -sf https://api.github.com/repos/syncthing/syncthing/releases/latest | jq -r '.tag_name')
          echo "tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "Latest stable tag: ${LATEST_TAG}"
          LATEST_COMMIT=$(git ls-remote https://github.com/syncthing/syncthing.git "refs/tags/${LATEST_TAG}^{}" | awk '{print $1}')
          echo "commit=${LATEST_COMMIT}" >> $GITHUB_OUTPUT
          echo "Latest commit: ${LATEST_COMMIT}"

      - name: Update submodule if newer
        if: ${{ steps.current.outputs.commit != steps.latest.outputs.commit }}
        run: |
          cd syncthing/src/github.com/syncthing/syncthing
          git fetch origin "refs/tags/${{ steps.latest.outputs.tag }}"
          git checkout "${{ steps.latest.outputs.tag }}"
          cd -
          git add syncthing/src/github.com/syncthing/syncthing

      - name: Update versions.toml
        id: version
        if: ${{ steps.current.outputs.commit != steps.latest.outputs.commit }}
        run: |
          set -eu
          TAG="${{ steps.latest.outputs.tag }}"
          # Strip leading "v"
          TAG="${TAG#v}"
          # Extract major.minor.patch from tag (e.g. 2.1.3 from 2.1.3)
          BASE_VERSION=$(echo "$TAG" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          # Append .0 as required by your version scheme
          NEW_VERSION="${BASE_VERSION}.0"
          sed -i -E 's/version-name = "[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+"/version-name = "'"${NEW_VERSION}"'"/' gradle/libs.versions.toml
          IFS='.' read -r MAJOR MINOR PATCH BUILD <<< "$NEW_VERSION"
          VERSION_CODE=$(( MAJOR*1000000 + MINOR*10000 + PATCH*100 + BUILD ))
          sed -i -E 's/version-code = "[0-9]+"/version-code = "'"${VERSION_CODE}"'"/' gradle/libs.versions.toml
          git add gradle/libs.versions.toml
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Updated version to: ${NEW_VERSION} (${VERSION_CODE})"

      # Note: a tag pushed with GITHUB_TOKEN does not trigger other workflows,
      # so the release pipeline is started explicitly via workflow_dispatch.
      - name: Commit, push, tag and dispatch release
        if: ${{ steps.current.outputs.commit != steps.latest.outputs.commit }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: pin Syncthing core to stable ${{ steps.latest.outputs.tag }}"
          git push origin main
          WRAPPER_TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${WRAPPER_TAG}" >/dev/null; then
            echo "::warning::Tag ${WRAPPER_TAG} already exists - skipping tag and release. Resolve manually (e.g. remove the old tag/release first)."
          else
            git tag "${WRAPPER_TAG}"
            git push origin "${WRAPPER_TAG}"
            gh workflow run release-app.yaml --ref main -f tag="${WRAPPER_TAG}"
            echo "Dispatched release pipeline for ${WRAPPER_TAG}"
          fi
