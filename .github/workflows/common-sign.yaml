name: Common Sign

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      applicationId:
        description: 'Application ID'
        required: true
        type: string
      buildType:
        description: 'Gradle build type'
        required: true
        type: string
      environmentName:
        description: 'Environment name (optional)'
        required: false
        default: ''
        type: string

jobs:
  sign:
    name: Sign ${{ inputs.buildType }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environmentName }}
    steps:
      - name: Install apksigner
        run: |
          set -eu
          # echo "deb [trusted=yes] http://deb.debian.org/debian trixie main" | sudo tee /etc/apt/sources.list.d/debian-trixie.list
          # sudo apt-get update
          # sudo apt-get install -y -t trixie apksigner
          sudo apt-get install -y apksigner

      - name: Download unsigned artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-${{ inputs.applicationId }}
          path: unsigned

      - name: Sign debug APK
        if: ${{ inputs.buildType == 'debug' }}
        run: |
          set -eu
          mkdir -p "${{ runner.temp }}/.android"
          echo "Using UNTRUSTED PUBLIC debug.keystore for builds from forked repositories"
          echo "" | base64 -d > "${{ runner.temp }}/.android/debug.keystore"
          for UNSIGNED_APK in unsigned/*/*.apk; do
            SIGNED_APK="$(basename -- "${UNSIGNED_APK}")"
            echo "Signing ${UNSIGNED_APK}"
            # --alignment-preserved
            apksigner sign \
              --ks "${{ runner.temp }}/.android/debug.keystore" \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --out "${SIGNED_APK}" "${UNSIGNED_APK}"
          done
          rm -f "${{ runner.temp }}/.android/debug.keystore"

      - name: Sign multiple release APK
        if: ${{ inputs.buildType == 'release' }}
        env:
          SIGNING_KEYSTORE_JKS_BASE64: ${{ secrets.SIGNING_KEYSTORE_JKS_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -eu
          shopt -s nullglob
          mkdir -p "${{ runner.temp }}/.android"
          #
          # Signing is always configured:
          # a) If the SIGNING_KEYSTORE_JKS_BASE64 and SIGNING_PASSWORD secrets are set,
          #    they are used to sign the release APKs.
          # b) Otherwise, an ephemeral self-signed release keystore is generated on the
          #    runner so that the pipeline always yields signed, installable APKs.
          #    Replace this by configuring the two secrets above for production signing.
          #
          if [ -n "${SIGNING_KEYSTORE_JKS_BASE64}" ]; then
            echo "${SIGNING_KEYSTORE_JKS_BASE64}" | base64 -d > "${{ runner.temp }}/.android/signing-keystore.jks"
            KS_PASSWORD="${SIGNING_PASSWORD}"
            echo "Using keystore from SIGNING_KEYSTORE_JKS_BASE64 secret"
          else
            KS_PASSWORD="$(head -c 32 /dev/urandom | base64 | tr -d '\n/+=' | cut -c1-24)"
            keytool -genkeypair -v \
              -keystore "${{ runner.temp }}/.android/signing-keystore.jks" \
              -storetype JKS \
              -storepass "${KS_PASSWORD}" \
              -keypass "${KS_PASSWORD}" \
              -alias Syncthing-Fork \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Syncthing-Fork, OU=Syncthing-Fork, O=Syncthing-Fork, L=Internet, ST=Internet, C=US"
            echo "Generated ephemeral self-signed release keystore (set SIGNING_KEYSTORE_JKS_BASE64 + SIGNING_PASSWORD secrets for a stable signature)"
          fi
          #
          for UNSIGNED_APK in unsigned/*/*.apk; do
            SIGNED_APK="$(basename -- "${UNSIGNED_APK}")"
            echo "Signing ${UNSIGNED_APK}"
            # --alignment-preserved
            apksigner sign \
              --ks "${{ runner.temp }}/.android/signing-keystore.jks" \
              --ks-pass pass:"${KS_PASSWORD}" \
              --key-pass pass:"${KS_PASSWORD}" \
              --ks-key-alias Syncthing-Fork \
              --out "${SIGNED_APK}" "${UNSIGNED_APK}"
          done
          #
          rm -f "${{ runner.temp }}/.android/signing-keystore.jks"

      - name: Upload signed artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: signed-${{ inputs.applicationId }}
          path: |
            ./*.apk
